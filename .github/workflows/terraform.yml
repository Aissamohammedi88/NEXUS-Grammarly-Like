# ═══════════════════════════════════════════════════════════════════════════════
# JOB 13 — DOCUMENTATION TERRAFORM (terraform-docs)
# ═══════════════════════════════════════════════════════════════════════════════
  docs:
    name: "Docs Terraform"
    runs-on: ubuntu-24.04
    needs: [metadata]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
​
      - name: "Setup terraform-docs"
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: |
            modules/vpc
            modules/ecs
            modules/rds
            modules/s3
            modules/cloudfront
            modules/waf
            modules/alb
            modules/ecr
            infra/dev
            infra/staging
            infra/prod
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "docs(terraform): mise à jour auto terraform-docs [skip ci]"
          git-push-user-name: "nexus-bot"
          git-push-user-email: "nexus-bot@users.noreply.github.com"
​
# ═══════════════════════════════════════════════════════════════════════════════
# JOB 14 — DESTROY (workflow_dispatch uniquement, jamais automatique)
# ═══════════════════════════════════════════════════════════════════════════════
  destroy:
    name: "DESTROY · ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-24.04
    needs: [metadata]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.environment != 'prod'
    environment:
      name: destroy-gate
    timeout-minutes: 60
    steps:
      - name: "Checkpoint — destroy non disponible en prod via CI"
        if: github.event.inputs.environment == 'prod'
        run: |
          echo "::error:: Destroy prod interdit depuis le CI. Utiliser la console AWS avec accès restreint."
          exit 1
​
      - name: "Checkout"
        uses: actions/checkout@v4
​
      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
​
      - name: "Configure AWS · ${{ github.event.inputs.environment }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', github.event.inputs.environment)] }}
          role-session-name: tf-destroy-${{ github.event.inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
​
      - name: "Terraform Init"
        working-directory: infra/${{ github.event.inputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET_PREFIX}-${{ github.event.inputs.environment }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=nexus-tf-locks-${{ github.event.inputs.environment }}"
​
      - name: "Terraform Destroy"
        working-directory: infra/${{ github.event.inputs.environment }}
        run: |
          terraform destroy \
            -auto-approve \
            -var-file=vars/${{ github.event.inputs.environment }}.tfvars
​
# ═══════════════════════════════════════════════════════════════════════════════
# JOB 15 — RAPPORT DE COÛTS MENSUEL
# ═══════════════════════════════════════════════════════════════════════════════
  monthly-cost-report:
    name: "Rapport de coûts mensuel"
    runs-on: ubuntu-24.04
    needs: metadata
    if: github.event.schedule == '0 8 1 * *'
    timeout-minutes: 30
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
​
      - name: "Setup Infracost"
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
​
      - name: "Configure AWS · ${{ matrix.environment }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          role-session-name: tf-cost-report-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
​
      - name: "Infracost breakdown · ${{ matrix.environment }}"
        run: |
          infracost breakdown \
            --path infra/${{ matrix.environment }} \
            --format table \
            --out-file /tmp/cost-report-${{ matrix.environment }}.txt \
            --terraform-var-file infra/${{ matrix.environment }}/vars/${{ matrix.environment }}.tfvars
​
      - name: "Infracost JSON · ${{ matrix.environment }}"
        run: |
          infracost breakdown \
            --path infra/${{ matrix.environment }} \
            --format json \
            --out-file /tmp/cost-report-${{ matrix.environment }}.json \
            --terraform-var-file infra/${{ matrix.environment }}/vars/${{ matrix.environment }}.tfvars
​
      - name: "Résumé coûts mensuels"
        run: |
          echo "## 💵 Rapport de coûts · ${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(jq -r '.totalMonthlyCost' /tmp/cost-report-${{ matrix.environment }}.json)
          PAST=$(jq -r '.pastTotalMonthlyCost' /tmp/cost-report-${{ matrix.environment }}.json)
          echo "| Mois courant | Mois précédent |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |"                     >> "$GITHUB_STEP_SUMMARY"
          echo "| \$${TOTAL} | \$${PAST} |"        >> "$GITHUB_STEP_SUMMARY"
​
      - name: "Upload rapport mensuel"
        uses: actions/upload-artifact@v4
        with:
          name: monthly-cost-${{ matrix.environment }}-${{ github.run_number }}
          path: /tmp/cost-report-${{ matrix.environment }}.*
          retention-days: 365
​
# ═══════════════════════════════════════════════════════════════════════════════
# JOB 16 — NOTIFICATIONS SLACK
# ═══════════════════════════════════════════════════════════════════════════════
  notify:
    name: "Notification Slack"
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - format
      - validate
      - lint
      - security
      - plan
      - apply-dev
      - apply-staging
      - apply-prod
    if: always()
    steps:
      - name: "Construire le message Slack"
        id: message
        run: |
          SHA="${{ needs.metadata.outputs.short_sha }}"
          BRANCH="${{ needs.metadata.outputs.branch }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
​
          # Collecter les statuts
          FORMAT_STATUS="${{ needs.format.result }}"
          VALIDATE_STATUS="${{ needs.validate.result }}"
          LINT_STATUS="${{ needs.lint.result }}"
          SECURITY_STATUS="${{ needs.security.result }}"
          PLAN_STATUS="${{ needs.plan.result }}"
          APPLY_DEV_STATUS="${{ needs.apply-dev.result }}"
          APPLY_STAGING_STATUS="${{ needs.apply-staging.result }}"
          APPLY_PROD_STATUS="${{ needs.apply-prod.result }}"
​
          status_emoji() {
            case "$1" in
              success)  echo ":white_check_mark:" ;;
              failure)  echo ":x:" ;;
              skipped)  echo ":large_yellow_circle:" ;;
              cancelled) echo ":white_circle:" ;;
              *)         echo ":grey_question:" ;;
            esac
          }
​
          OVERALL="success"
          for s in "$FORMAT_STATUS" "$VALIDATE_STATUS" "$LINT_STATUS" "$PLAN_STATUS" "$APPLY_PROD_STATUS"; do
            [[ "$s" == "failure" ]] && OVERALL="failure"
          done
​
          COLOR="good"; [[ "$OVERALL" == "failure" ]] && COLOR="danger"
​
          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg run_url "$RUN_URL" \
            --arg actor "${{ github.actor }}" \
            --arg fmt "$(status_emoji $FORMAT_STATUS)" \
            --arg val "$(status_emoji $VALIDATE_STATUS)" \
            --arg lint "$(status_emoji $LINT_STATUS)" \
            --arg sec "$(status_emoji $SECURITY_STATUS)" \
            --arg plan "$(status_emoji $PLAN_STATUS)" \
            --arg dev "$(status_emoji $APPLY_DEV_STATUS)" \
            --arg stg "$(status_emoji $APPLY_STAGING_STATUS)" \
            --arg prod "$(status_emoji $APPLY_PROD_STATUS)" \
            '{
              attachments: [{
                color: $color,
                title: "NEXUS Terraform CI/CD",
                title_link: $run_url,
                fields: [
                  {title: "Branch",    value: $branch, short: true},
                  {title: "Commit",    value: $sha,    short: true},
                  {title: "Actor",     value: $actor,  short: true},
                  {title: "Format",    value: $fmt,    short: true},
                  {title: "Validate",  value: $val,    short: true},
                  {title: "Lint",      value: $lint,   short: true},
                  {title: "Security",  value: $sec,    short: true},
                  {title: "Plan",      value: $plan,   short: true},
                  {title: "Apply dev", value: $dev,    short: true},
                  {title: "Apply stg", value: $stg,    short: true},
                  {title: "Apply prod",value: $prod,   short: true}
                ],
                footer: "NEXUS-Grammarly Infrastructure",
                ts: now | floor
              }]
            }')
​
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"
​
      - name: "Envoyer notification Slack"
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            --data '${{ steps.message.outputs.payload }}' \
            "$SLACK_WEBHOOK_URL" \
            && echo "Notification Slack envoyée." \
            || echo "Erreur notification Slack (non bloquant)."
​
# ═══════════════════════════════════════════════════════════════════════════════
# JOB 17 — STATE BACKUP
# ═══════════════════════════════════════════════════════════════════════════════
  state-backup:
    name: "Backup State · ${{ matrix.environment }}"
    runs-on: ubuntu-24.04
    needs: [apply-dev, apply-staging, apply-prod]
    if: |
      always() &&
      (needs.apply-dev.result == 'success' ||
       needs.apply-staging.result == 'success' ||
       needs.apply-prod.result == 'success')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: "Configure AWS · ${{ matrix.environment }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          role-session-name: tf-backup-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
​
      - name: "Copier state vers bucket de backup"
        run: |
          DATE=$(date +%Y/%m/%d)
          SHA="${{ needs.metadata.outputs.short_sha }}"
          SRC="s3://${STATE_BUCKET_PREFIX}-${{ matrix.environment }}/terraform.tfstate"
          DST="s3://${STATE_BUCKET_PREFIX}-backups/${{ matrix.environment }}/${DATE}/${SHA}/terraform.tfstate"
​
          aws s3 cp "$SRC" "$DST" \
            --sse aws:kms \
            --metadata "GitSha=${SHA},RunId=${{ github.run_id }},Actor=${{ github.actor }}" \
            && echo "✅ State sauvegardé → ${DST}" \
            || echo "⚠️ Backup state échoué (non bloquant)."
​
      - name: "Nettoyage des backups > 90 jours"
        run: |
          CUTOFF=$(date -d '-90 days' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                   date -v-90d +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 \
            --bucket "${STATE_BUCKET_PREFIX}-backups" \
            --prefix "${{ matrix.environment }}/" \
            --query "Contents[?LastModified<'${CUTOFF}'].Key" \
            --output text | tr '\t' '\n' | while read key; do
            [ -z "$key" ] && continue
            echo "Suppression backup expiré : $key"
            aws s3 rm "s3://${STATE_BUCKET_PREFIX}-backups/${key}" || true
          done
​
# ═══════════════════════════════════════════════════════════════════════════════
# JOB 18 — AUDIT LOG
# ═══════════════════════════════════════════════════════════════════════════════
  audit:
    name: "Audit Log"
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - plan
      - apply-dev
      - apply-staging
      - apply-prod
    if: always()
    timeout-minutes: 10
    steps:
      - name: "Enregistrer l'audit dans DynamoDB"
        run: |
          # Écriture d'une entrée d'audit dans DynamoDB
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA="${{ needs.metadata.outputs.short_sha }}"
          ACTOR="${{ github.actor }}"
          EVENT="${{ github.event_name }}"
          RUN_ID="${{ github.run_id }}"
          BRANCH="${{ needs.metadata.outputs.branch }}"
          ACTION="${{ github.event.inputs.action || 'push' }}"
​
          ITEM=$(jq -n \
            --arg ts "$TIMESTAMP" \
            --arg sha "$SHA" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg run "$RUN_ID" \
            --arg branch "$BRANCH" \
            --arg action "$ACTION" \
            --arg plan_result "${{ needs.plan.result }}" \
            --arg apply_dev "${{ needs.apply-dev.result }}" \
            --arg apply_staging "${{ needs.apply-staging.result }}" \
            --arg apply_prod "${{ needs.apply-prod.result }}" \
            '{
              pk: {S: ("RUN#" + $run)},
              sk: {S: $ts},
              sha: {S: $sha},
              actor: {S: $actor},
              event: {S: $event},
              branch: {S: $branch},
              action: {S: $action},
              plan_result: {S: $plan_result},
              apply_dev: {S: $apply_dev},
              apply_staging: {S: $apply_staging},
              apply_prod: {S: $apply_prod},
            }')
​
          aws dynamodb put-item \
            --table-name nexus-tf-audit \
            --item "$ITEM" \
            --region "${AWS_REGION}" \
            2>/dev/null || echo "Audit DynamoDB non disponible (non bloquant)."
​
      - name: "Résumé global pipeline"
        if: always()
        run: |
          echo "# Résumé Pipeline Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Champ | Valeur |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ needs.metadata.outputs.branch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ needs.metadata.outputs.short_sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | ${{ github.run_id }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plan | ${{ needs.plan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apply dev | ${{ needs.apply-dev.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apply staging | ${{ needs.apply-staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apply prod | ${{ needs.apply-prod.result }} |" >> "$GITHUB_STEP_SUMMARY"
​
